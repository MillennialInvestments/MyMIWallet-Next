<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMI Chat</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <header>
    <div class="logo">MyMI Chat</div>
    <div class="status" id="status">Secure session</div>
  </header>

  <main>
    <section class="transcript" id="transcript" aria-live="polite"></section>
    <form id="chat-form">
      <label class="sr-only" for="message">Your message</label>
      <textarea id="message" name="message" placeholder="Ask a question..." required></textarea>
      <div class="controls">
        <button type="submit" id="send-btn">Send</button>
        <span class="hint">Shift + Enter for new line</span>
      </div>
    </form>
  </main>

  <template id="message-template">
    <div class="message">
      <div class="role"></div>
      <div class="content"></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
