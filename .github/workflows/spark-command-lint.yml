name: Spark Command Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spark-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate Spark command constructors
        run: php tools/spark_scan_commands.php
