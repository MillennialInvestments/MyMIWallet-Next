name: AiOps Auto-Close PR on Failure

on:
  workflow_run:
    workflows: ["Codex Full Audit"]
    types:
      - completed

jobs:
  autoclose:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Close PR for aiops/* branches (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "Workflow failed on branch: ${HEAD_BRANCH}"

          if [[ "${HEAD_BRANCH}" != aiops/* ]]; then
            echo "Not an aiops branch. Skipping."
            exit 0
          fi

          # Find open PR for this head branch
          PR_NUM=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&head=${REPO_OWNER:-$(echo $REPO | cut -d/ -f1)}:${HEAD_BRANCH}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")

          if [[ -z "${PR_NUM}" ]]; then
            echo "No open PR found. Exiting."
            exit 0
          fi

          echo "Closing PR #${PR_NUM}"
          curl -s -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUM}" \
            -d '{"state":"closed"}' >/dev/null

          echo "Closed PR #${PR_NUM}"
