name: CI Config Guard (CI4)

on:
  pull_request:
    paths:
      - 'app/Config/Services.php'
      - 'app/Config/Filters.php'
      - 'app/Config/App.php'
  push:
    branches: [main, develop]
    paths:
      - 'app/Config/Services.php'
      - 'app/Config/Filters.php'
      - 'app/Config/App.php'

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  config_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare CodeIgniter writable directories
        run: bash scripts/ci/prepare-writable.sh
      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Run config lint
        run: php spark config:lint

      - name: Upload config guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-config-guard-artifacts
          path: |
            writable/logs/*
            writable/ci/*
