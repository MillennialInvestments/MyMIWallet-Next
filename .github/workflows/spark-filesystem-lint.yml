name: Spark Filesystem Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  filesystem-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare CI environment
        run: |
          echo "CI_ENVIRONMENT=ci" >> .env
          echo "APP_ENV=ci" >> .env

      - name: Run filesystem lint
        run: php spark ops:filesystem:lint
