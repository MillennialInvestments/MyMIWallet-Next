name: Spark Filesystem Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  filesystem-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare CI environment
        run: cp env/.env.ci.example .env

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Run filesystem lint (JSON)
        continue-on-error: true
        run: |
          mkdir -p writable/aiops/artifacts/review-publish
          php spark ops:filesystem:lint --json > writable/aiops/artifacts/review-publish/filesystem.json

      - name: Publish review summary
        run: php spark codex:review:publish

      - name: Upload filesystem lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-filesystem-lint-artifacts
          path: |
            writable/aiops/artifacts/review-publish/*
            writable/logs/*
            writable/ci/*
            docs/_aiops/*

      - name: Gate on blocking errors
        run: |
          php -r '$data=json_decode(file_get_contents("writable/aiops/artifacts/review-publish/latest.json"),true); if (!is_array($data)) { fwrite(STDERR,"Missing review publish output\n"); exit(1);} if (!empty($data["blocking_errors"])) { fwrite(STDERR,"Blocking errors detected\n"); exit(1);}'
