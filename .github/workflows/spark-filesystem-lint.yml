name: Spark Filesystem Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  filesystem-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare CI environment
        run: cp env/.env.ci.example .env

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Run filesystem lint (JSON)
        run: |
          mkdir -p writable/aiops/artifacts/review-publish
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > writable/aiops/artifacts/review-publish/changed-files.txt
          php spark ops:filesystem:lint --json > writable/aiops/artifacts/review-publish/filesystem.json || true
          php -r '
          $base = "writable/aiops/artifacts/review-publish";
          $changedPath = $base . "/changed-files.txt";
          $jsonPath = $base . "/filesystem.json";
          $latestPath = $base . "/latest.json";
          $changed = is_file($changedPath) ? array_filter(array_map("trim", file($changedPath))) : [];
          $changedSet = array_fill_keys($changed, true);
          $raw = is_file($jsonPath) ? file_get_contents($jsonPath) : "{}";
          $data = json_decode($raw, true);
          if (! is_array($data)) { $data = ["parse_error" => true, "raw" => $raw]; }

          $hits = [];
          $walk = function ($node) use (&$walk, &$hits, $changedSet) {
              if (! is_array($node)) { return; }
              $file = $node["file"] ?? $node["path"] ?? null;
              $level = strtolower((string) ($node["level"] ?? $node["severity"] ?? $node["type"] ?? ""));
              $isError = str_contains($level, "error") || (($node["error"] ?? false) === true);
              if (is_string($file) && isset($changedSet[$file]) && $isError) {
                  $hits[] = $node;
              }
              foreach ($node as $v) { $walk($v); }
          };
          $walk($data);

          $latest = [
              "generated_at" => date("c"),
              "mode" => "changed-files-only",
              "changed_files" => array_values($changed),
              "blocking_errors" => count($hits) > 0,
              "blocking_changed_file_errors" => $hits,
              "source" => "ops:filesystem:lint",
          ];
          file_put_contents($latestPath, json_encode($latest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
          '
      - name: Upload filesystem lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-filesystem-lint-artifacts
          path: |
            writable/aiops/artifacts/review-publish/*
            writable/logs/*
            writable/ci/*
            docs/_aiops/*

      - name: Gate on blocking errors
        run: |
          php -r '$data=json_decode(file_get_contents("writable/aiops/artifacts/review-publish/latest.json"),true); if (!is_array($data)) { fwrite(STDERR,"Missing review publish output\n"); exit(1);} if (!empty($data["blocking_errors"])) { fwrite(STDERR,"Blocking errors detected\n"); exit(1);}'
