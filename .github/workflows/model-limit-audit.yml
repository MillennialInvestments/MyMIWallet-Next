name: Model Limit Audit

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare CodeIgniter writable directories
        run: bash scripts/ci/prepare-writable.sh
      - name: Run model limit audit
        run: bash scripts/ci/check_model_limit_regression.sh
