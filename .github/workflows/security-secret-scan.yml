name: Security Secret Scan (PR diff)

# MYMI-GTM-003A: blocking secret scan of NEW commits only.
#
# Scope: scans the commit range introduced by a pull request (or a push to
# main), including nested paths such as chat/.env. It intentionally does not
# fail on inherited baseline exposure; the historically tracked chat/.env is
# registered under MYMI-GTM-001 (rotation) and MYMI-GTM-002 (untracking), and
# is reported below as a non-blocking warning until those tasks close.
#
# Findings are printed redacted. This workflow never prints secret values.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history for range scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          range="$(bash scripts/ci/pr_diff_range.sh)"
          base="${range% *}"
          head="${range#* }"
          echo "Scanning ${base}..${head}"
          {
            echo "base=${base}"
            echo "head=${head}"
          } >> "$GITHUB_OUTPUT"

      - name: Block newly added env files (blocking)
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          added="$(git diff --name-only --diff-filter=AR "$BASE" "$HEAD" \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -vE '\.(example|sample|template|dist)$' || true)"
          if [ -n "$added" ]; then
            while IFS= read -r f; do
              echo "::error file=${f}::New env file added. Commit a *.example contract instead and keep real values in the runtime secret store."
            done <<< "$added"
            exit 1
          fi
          echo "No new env files added in range."

      - name: Report inherited tracked env files (non-blocking)
        run: |
          tracked="$(git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -vE '\.(example|sample|template|dist)$' || true)"
          if [ -n "$tracked" ]; then
            while IFS= read -r f; do
              echo "::warning file=${f}::Tracked env file is inherited baseline exposure (MYMI-GTM-001/002). Report-only; does not fail this job."
            done <<< "$tracked"
          else
            echo "No tracked env files."
          fi

      - name: Gitleaks scan of commit range (blocking, redacted)
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          if [ "$BASE" = "$HEAD" ]; then
            echo "Empty range; nothing to scan."
            exit 0
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
              --source /repo \
              --log-opts "${BASE}..${HEAD}" \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1
