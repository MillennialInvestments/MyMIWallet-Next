name: Codex Review Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  codex_review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Spark Writable Bootstrap
        run: |
          mkdir -p writable/cache/FactoriesCache writable/logs
          chmod -R 777 writable

      - name: Generate Codex Review
        run: php spark codex:review

      - name: Publish Codex Review to Discord
        env:
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
        run: php spark codex:review:publish --latest --discord
