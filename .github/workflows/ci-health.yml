name: MyMI Wallet Health Check

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare CodeIgniter writable directories
        run: bash scripts/ci/prepare-writable.sh
      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Spark Diagnostics
        run: |
          php spark spark:purge-fastcgi
          php spark spark:diagnose-503
          php spark logs:full-report today

      - name: Filesystem Safety Lint (PR Gate)
        run: bash scripts/ci/check_filesystem_regression.sh

      - name: CI-Safe Optimize
        run: php spark optimize:safe

      - name: 502 Diagnose Smoke Test
        run: php spark runtime:diagnose-502 --self-test
      - name: Commands Lint (PR Gate)
        run: php spark ops:commands:lint
      - name: AIops Init (Dry Run)
        run: php spark ops:aiops:init --dry-run
      - name: AIops Init (Approve)
        run: php spark ops:aiops:init --approve
      - name: Email Scraper Audit
        run: php spark scraper:email-scraper-audit
      - name: Codex Review List
        run: php spark codex:review:list
      - name: Codex Review Commit
        run: php spark codex:review:commit
      - name: Codex Review Publish
        run: php spark codex:review:publish
      - name: CI Health Check Complete
        run: echo "CI Health Check Completed Successfully"  

      - name: Upload CI health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-health-artifacts
          path: |
            writable/logs/*
            writable/ci/*
            docs/_aiops/*
        
