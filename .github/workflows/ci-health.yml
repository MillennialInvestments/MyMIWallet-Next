name: MyMI Wallet Health Check

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Spark Diagnostics
        run: |
          php spark spark:purge-fastcgi
          php spark spark:diagnose-503
          php spark logs:full-report today

      - name: Filesystem Safety Lint (PR Gate)
        run: |
          php spark ops:filesystem:lint || true
          echo "Filesystem lint is report-only here; Spark Filesystem Guard owns changed-file gating."

      - name: CI-Safe Optimize
        run: php spark optimize:safe

      - name: 502 Diagnose Smoke Test
        run: php spark runtime:diagnose-502 --self-test
      - name: Commands Lint (PR Gate)
        run: php spark ops:commands:lint
      - name: Spark Command Registration Gate
        run: |
          php spark list > writable/ci/registered-spark-commands.txt
          for cmd in ops:ci:prepare ops:commands:lint optimize:safe runtime:diagnose-502 aiops:copilot:validate codex:review:list codex:review:publish; do
            grep -Eq "^[[:space:]]+${cmd}[[:space:]]" writable/ci/registered-spark-commands.txt
          done

      - name: AIOps CI-Safe Validation
        run: php spark aiops:copilot:validate --ci

      - name: Codex Review List
        run: php spark codex:review:list

      - name: Codex Review Publish (Dry Run)
        run: php spark codex:review:publish --dry-run

      - name: CI Health Check Complete
        run: echo "CI Health Check Completed Successfully"  

      - name: Upload CI health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-health-artifacts
          path: |
            writable/logs/*
            writable/ci/*
            docs/_aiops/*
