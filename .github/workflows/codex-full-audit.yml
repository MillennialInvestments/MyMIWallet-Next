name: Codex Full Audit

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Run Codex Audit
        run: |
          find app -type f -name "*.php" > files.txt
          while read file; do
            echo "Reviewing $file"
          done < files.txt
