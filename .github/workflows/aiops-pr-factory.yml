name: AIOps PR Factory

on:
  push:
    paths:
      - "aiops/prs/outbox/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  pr_factory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate PR bundles
        id: bundles
        run: |
          set -euo pipefail
          # Find directories containing manifest.json
          mapfile -t DIRS < <(find aiops/prs/outbox -name manifest.json -print0 | xargs -0 -n1 dirname | sort -u)
          if [ "${#DIRS[@]}" -eq 0 ]; then
            echo "No bundles found."
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          printf "%s\n" "${DIRS[@]}" > /tmp/bundles.txt
          echo "count=${#DIRS[@]}" >> $GITHUB_OUTPUT
          echo "Found ${#DIRS[@]} bundle(s)."

      - name: Create PR(s) from bundles
        if: steps.bundles.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.AIOPS_GH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing secrets.AIOPS_GH_TOKEN"
            exit 20
          fi

          while read -r BUNDLE; do
            echo "Processing bundle: $BUNDLE"

            MANIFEST="$BUNDLE/manifest.json"
            PRMD="$BUNDLE/pr.md"
            PATCH="$BUNDLE/changes.patch"

            if [ ! -f "$MANIFEST" ] || [ ! -f "$PRMD" ] || [ ! -f "$PATCH" ]; then
              echo "Bundle missing required files. Skipping."
              continue
            fi

            SLUG="$(jq -r '.slug' "$MANIFEST")"
            TITLE="$(jq -r '.title' "$MANIFEST")"
            ALLOW_AUTO_PR="$(jq -r '.allow_auto_pr' "$MANIFEST")"

            if [ "$ALLOW_AUTO_PR" != "true" ]; then
              echo "allow_auto_pr=false, skipping PR creation."
              continue
            fi

            BRANCH="aiops/${SLUG}-$(date +%Y%m%d%H%M%S)"

            # Create branch off main (or default branch)
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

            git checkout "$DEFAULT_BRANCH"
            git pull origin "$DEFAULT_BRANCH"
            git checkout -b "$BRANCH"

            # Apply patch
            if ! git apply --whitespace=nowarn "$PATCH"; then
              echo "Patch failed to apply for bundle: $BUNDLE"
              git checkout "$DEFAULT_BRANCH"
              continue
            fi

            # Commit
            git add -A
            if git diff --cached --quiet; then
              echo "No changes after patch apply. Skipping."
              git checkout "$DEFAULT_BRANCH"
              continue
            fi

            git commit -m "$TITLE" -m "Generated by AIOps PR Factory from bundle: $BUNDLE"

            # Push
            git push origin "$BRANCH"

            # Create PR
            BODY="$(cat "$PRMD")"
            PR_URL="$(gh pr create --title "$TITLE" --body "$BODY" --base "$DEFAULT_BRANCH" --head "$BRANCH" || true)"

            echo "PR created: $PR_URL"

          done < /tmp/bundles.txt
