name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Rebuild autoload cache
        run: composer dump-autoload

      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare writable directories
        run: |
          mkdir -p writable/cache
          mkdir -p writable/logs
          mkdir -p writable/session
          mkdir -p writable/uploads
          chmod -R 777 writable

      - name: CI install bootstrap (if available)
        run: |
          if php spark | grep -q "app:install"; then
            php spark app:install
          else
            echo "app:install not registered; skipping"
          fi

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Spark Command Contract Check
        run: |
          php spark ops:commands:audit --json

      - name: Spark Command Lint
        run: |
          php spark ops:commands:lint

      - name: Spark Filesystem Lint
        run: |
          php spark ops:filesystem:lint

      - name: Codex Review Dry Run
        run: |
          php spark codex:review --dry-run

      - name: Spark Doctor
        run: |
          php spark spark:doctor

      - name: Subsystem Audit (non-strict)
        run: |
          php spark ops:subs:audit --json=1 --strict=0 > subs-audit.json



      - name: API Governance Audit
        run: php spark api:audit

      - name: API Filters Gate
        run: php spark api:filters-check

      - name: API Rate Limit Gate
        run: php spark api:rate-limit-check

      - name: API Versioning Gate
        run: php spark api:versioning-check

      - name: PHPUnit (unit)
        run: phpunit --testsuite unit

      - name: PHPUnit (auth smoke)
        run: phpunit --testsuite auth-smoke

      - name: Auth Flow Smoke Command
        run: php spark auth:flow-smoke

      - name: PHPCS (if available)
        run: |
          if [ -x vendor/bin/phpcs ]; then
            vendor/bin/phpcs app tests --standard=PSR12
          else
            echo "vendor/bin/phpcs not installed; skipping"
          fi

      - name: Upload Subsystem Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subs-audit
          path: |
            subs-audit.json
            writable/logs/*
            writable/ci/*
            docs/_aiops/*
            docs/APIs/audit/latest.md
            docs/APIs/audit/*
            docs/security/*

  aiops-guardrails:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Rebuild autoload cache
        run: composer dump-autoload

      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare writable directories
        run: |
          mkdir -p writable/cache
          mkdir -p writable/logs
          mkdir -p writable/session
          mkdir -p writable/uploads
          chmod -R 777 writable

      - name: CI install bootstrap (if available)
        run: |
          if php spark | grep -q "app:install"; then
            php spark app:install
          else
            echo "app:install not registered; skipping"
          fi

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Copilot Validation
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          php spark aiops:copilot:validate --json > copilot-validation.json || true
          php -r '
          $changed = array_fill_keys(array_filter(array_map("trim", file("changed-files.txt"))), true);
          $data = json_decode(file_get_contents("copilot-validation.json"), true);
          if (! is_array($data)) { fwrite(STDERR, "Invalid copilot-validation.json\n"); exit(1); }
          $bad = [];
          foreach (($data["commands"]["violations"] ?? []) as $v) {
              $file = $v["file"] ?? "";
              if ($file !== "" && isset($changed[$file])) { $bad[] = $v; }
          }
          if ($bad) { fwrite(STDERR, "Changed-file copilot violations:\n" . json_encode($bad, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n"); exit(1); }
          echo "No changed-file copilot violations.\n";
          '

      - name: Spark Doctor
        run: |
          php spark spark:doctor --json > doctor.json

      - name: Upload AIOps Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-artifacts
          path: |
            copilot-validation.json
            doctor.json
            writable/logs/*
            writable/ci/*
            docs/_aiops/*
            docs/APIs/audit/latest.md
            docs/APIs/audit/*
            docs/security/*
