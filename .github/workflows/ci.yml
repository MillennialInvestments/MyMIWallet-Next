name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_ENVIRONMENT: testing
  ENVIRONMENT: testing
  CI: true
  MYMI_DISABLE_EXTERNAL: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Rebuild autoload cache
        run: composer dump-autoload

      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare writable directories
        run: |
          mkdir -p writable/cache
          mkdir -p writable/logs
          mkdir -p writable/session
          mkdir -p writable/uploads
          chmod -R 777 writable

      - name: CI install bootstrap (if available)
        run: |
          if php spark | grep -q "app:install"; then
            php spark app:install
          else
            echo "app:install not registered; skipping"
          fi

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Spark Command Contract Check
        run: |
          php spark ops:commands:audit --json

      - name: Spark Command Lint
        run: |
          php spark ops:commands:lint

      - name: Spark Filesystem Lint
        run: |
          php spark ops:filesystem:lint || true
          echo "Filesystem lint is report-only here; Spark Filesystem Guard owns changed-file gating."

      - name: Codex Review Dry Run
        run: |
          php spark codex:review --dry-run

      - name: Spark Doctor
        run: |
          php spark spark:doctor || true
          echo "Spark Doctor is report-only here during baseline CI stabilization."

      - name: Subsystem Audit (non-strict)
        run: |
          php spark ops:subs:audit --json=1 --strict=0 > subs-audit.json



      - name: API Governance Audit
        run: php spark api:audit

      - name: API Filters Gate
        run: php spark api:filters-check

      - name: API Rate Limit Gate
        run: php spark api:rate-limit-check

      - name: API Versioning Gate
        run: php spark api:versioning-check

      - name: PHPUnit (unit)
        run: phpunit --testsuite unit

      - name: PHPUnit (auth smoke)
        run: phpunit --testsuite auth-smoke

      - name: Auth Flow Smoke Command
        run: php spark auth:flow-smoke

      - name: PHPCS (if available)
        run: |
          if [ -x vendor/bin/phpcs ]; then
            vendor/bin/phpcs app tests --standard=PSR12
          else
            echo "vendor/bin/phpcs not installed; skipping"
          fi

      - name: Upload Subsystem Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subs-audit
          path: |
            subs-audit.json
            writable/logs/*
            writable/ci/*
            docs/_aiops/*
            docs/APIs/audit/latest.md
            docs/APIs/audit/*
            docs/security/*

  aiops-guardrails:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Rebuild autoload cache
        run: composer dump-autoload

      - name: Bootstrap CI .env
        run: cp env/.env.ci.example .env

      - name: Prepare writable directories
        run: |
          mkdir -p writable/cache
          mkdir -p writable/logs
          mkdir -p writable/session
          mkdir -p writable/uploads
          chmod -R 777 writable

      - name: CI install bootstrap (if available)
        run: |
          if php spark | grep -q "app:install"; then
            php spark app:install
          else
            echo "app:install not registered; skipping"
          fi

      - name: Prepare CI writable/artifacts
        run: php spark ops:ci:prepare

      - name: Copilot Validation
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only FETCH_HEAD HEAD > changed-files.txt
          php spark aiops:copilot:validate --json > copilot-validation.raw 2> copilot-validation.err || true
          php -r '
          $raw = is_file("copilot-validation.raw") ? file_get_contents("copilot-validation.raw") : "";
          $stderr = is_file("copilot-validation.err") ? file_get_contents("copilot-validation.err") : "";
          $json = null;
          $start = strpos($raw, "{");
          $end = strrpos($raw, "}");

          if ($start !== false && $end !== false && $end >= $start) {
              $json = substr($raw, $start, $end - $start + 1);
          }

          $data = $json !== null ? json_decode($json, true) : null;

          if (! is_array($data)) {
              $data = [
                  "status" => "invalid_json_report_only",
                  "commands" => ["violations" => []],
                  "raw_sha1" => sha1($raw),
                  "stderr_sha1" => sha1($stderr),
                  "note" => "Copilot validation did not emit parseable JSON; treated as report-only for inherited baseline stabilization.",
              ];
          }

          file_put_contents("copilot-validation.json", json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);

          $changed = array_fill_keys(array_filter(array_map("trim", file("changed-files.txt"))), true);
          $bad = [];

          foreach (($data["commands"]["violations"] ?? []) as $v) {
              $file = $v["file"] ?? "";
              if ($file !== "" && isset($changed[$file])) {
                  $bad[] = $v;
              }
          }

          if ($bad) {
              fwrite(STDERR, "Changed-file copilot violations:\n" . json_encode($bad, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
              exit(1);
          }

          echo "No changed-file copilot violations.\n";
          '

      - name: Spark Doctor
        run: |
          php spark spark:doctor --json > doctor.json || true
          echo "Spark Doctor JSON is report-only here during baseline CI stabilization."

      - name: Upload AIOps Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-artifacts
          path: |
            copilot-validation.json
            doctor.json
            writable/logs/*
            writable/ci/*
            docs/_aiops/*
            docs/APIs/audit/latest.md
            docs/APIs/audit/*
            docs/security/*
